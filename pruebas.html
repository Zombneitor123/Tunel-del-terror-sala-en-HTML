<body>
  <h1>Banco de Pruebas de Investigación · Sala 4</h1>
  <p>Archivo para experimentar con etiquetas HTML antes de incorporarlas a la sala oficial.</p>

  <!-- ========================================================
       PRUEBA RETO 1: Semántica vs Divs genéricos
       ======================================================== -->
  <section>
    <h2>Prueba Reto 1: Estructura Semántica</h2>
    <!-- Estructura antigua sin semántica -->
    <div id="cabecera-generica">
      <p>Cabecera con div (sin significado para lectores de pantalla)</p>
    </div>

    <!-- Estructura semántica HTML5 -->
    <header>
      <p>Cabecera semántica con &lt;header&gt; (reconocida como landmark)</p>
    </header>
  </section>
</body>
